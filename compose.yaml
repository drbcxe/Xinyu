# Keep the existing storage namespace when the application/folder is renamed.
# PostgreSQL credentials and volume identities are compatibility identifiers.
name: researchmate

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: researchmate
      POSTGRES_USER: researchmate
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "researchmate", "-d", "researchmate"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  auth_redis_data:
