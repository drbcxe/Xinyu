[project]
name = "xinyu"
description = "Xinyu 心语：帮助现实情侣理解沟通、记住偏好并跟进重要事项的私人 AI 助手"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.156.8",
    "fastembed>=0.9.1",
    "filelock>=4.2.4,<5",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.17,<1.18",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "agentevals>=0.0.9,<0.1",
    "psutil>=7,<8",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
